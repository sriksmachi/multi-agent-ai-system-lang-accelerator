version: '3.8'

services:
  # Planner Agent Service
  planner:
    build:
      context: .
      dockerfile: agents/planner_agent/Dockerfile
    container_name: planner-agent
    ports:
      - "8001:8001"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AGENT_NAME=planner
      - AGENT_PORT=8001
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Researcher Agent Service
  researcher:
    build:
      context: .
      dockerfile: agents/researcher_agent/Dockerfile
    container_name: researcher-agent
    ports:
      - "8002:8002"
    environment:
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - AZURE_SEARCH_ADMIN_KEY=${AZURE_SEARCH_ADMIN_KEY}
      - AZURE_SEARCH_INDEX_NAME=${AZURE_SEARCH_INDEX_NAME:-documents-index}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AGENT_NAME=researcher
      - AGENT_PORT=8002
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Writer Agent Service
  writer:
    build:
      context: .
      dockerfile: agents/writer_agent/Dockerfile
    container_name: writer-agent
    ports:
      - "8003:8003"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AGENT_NAME=writer
      - AGENT_PORT=8003
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Reviewer Agent Service
  reviewer:
    build:
      context: .
      dockerfile: agents/reviewer_agent/Dockerfile
    container_name: reviewer-agent
    ports:
      - "8004:8004"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_MODEL_NAME=${AZURE_MODEL_NAME}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AGENT_NAME=reviewer
      - AGENT_PORT=8004
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Orchestrator API Service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrator-api
    ports:
      - "8000:8000"
    environment:
      # Agent service URLs (internal Docker network)
      - PLANNER_SERVICE_URL=http://planner:8001
      - RESEARCHER_SERVICE_URL=http://researcher:8002
      - WRITER_SERVICE_URL=http://writer:8003
      - REVIEWER_SERVICE_URL=http://reviewer:8004
      # Azure Services
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - COSMOS_ENDPOINT=${COSMOS_ENDPOINT}
      - COSMOS_KEY=${COSMOS_KEY}
      - COSMOS_DATABASE_NAME=${COSMOS_DATABASE_NAME}
      - COSMOS_CHECKPOINTS_CONTAINER=${COSMOS_CHECKPOINTS_CONTAINER}
      - USE_MANAGED_IDENTITY=${USE_MANAGED_IDENTITY:-false}
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - AZURE_SEARCH_ADMIN_KEY=${AZURE_SEARCH_ADMIN_KEY}
      - AZURE_SEARCH_INDEX_NAME=${AZURE_SEARCH_INDEX_NAME:-documents-index}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      planner:
        condition: service_healthy
      researcher:
        condition: service_healthy
      writer:
        condition: service_healthy
      reviewer:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
    name: multi-agent-network
