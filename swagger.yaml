swagger: '2.0'
info:
  title: LinkedIn Post Generator MCP Server
  description: >-
    FastMCP server for generating LinkedIn posts using a multi-agent system.
    
    **Copilot Studio Integration:**
    
    1. Open your agent in Copilot Studio
    
    2. Go to: Tools → Add Tool → New Tool → MCP
    
    3. Enter server URL: https://langfuseappservice.azurewebsites.net/mcp
    
    4. Save and test
    
    
    The server uses FastMCP with streamable HTTP transport for MCP protocol compliance.
    
    
    **Available Tools:**
    
    - generate_linkedin_post: Generate professional LinkedIn posts (non-streaming)
    
    - generate_linkedin_post_streaming: Generate posts with real-time streaming
  version: 1.0.0
host: langfuseappservice.azurewebsites.net
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
  
paths:
  /:
    get:
      summary: API Root
      operationId: GetRoot
      produces:
        - application/json
      responses:
        '200':
          description: Success
  
  /health:
    get:
      summary: Health Check
      operationId: HealthCheck
      description: FastMCP health check endpoint
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/HealthResponse'
  
  /mcp:
    post:
      summary: FastMCP Server Endpoint
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: MCPServer
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
                example: "2.0"
              method:
                type: string
                example: "tools/call"
              params:
                type: object
              id:
                type: integer
                example: 1
      responses:
        '200':
          description: Success - MCP JSON-RPC response
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              result:
                type: object
              id:
                type: integer
        '400':
          description: Bad Request - Invalid MCP request
        '500':
          description: Internal Server Error
    options:
      summary: CORS Preflight
      operationId: MCPOptions
      description: Handle CORS preflight requests for cross-origin access
      responses:
        '200':
          description: Success

definitions:
  HealthResponse:
    type: object
    properties:
      status:
        type: string
        example: healthy
      message:
        type: string
        example: FastMCP API is running
      version:
        type: string
        example: "0.2.0"
  
  MCPToolsListRequest:
    type: object
    required:
      - jsonrpc
      - method
      - id
    properties:
      jsonrpc:
        type: string
        example: "2.0"
      method:
        type: string
        example: "tools/list"
      id:
        type: integer
        example: 1
  
  MCPToolCallRequest:
    type: object
    required:
      - jsonrpc
      - method
      - params
      - id
    properties:
      jsonrpc:
        type: string
        example: "2.0"
      method:
        type: string
        example: "tools/call"
      params:
        type: object
        properties:
          name:
            type: string
            example: "generate_linkedin_post"
          arguments:
            type: object
            properties:
              topic:
                type: string
                example: "AI trends in 2026"
              platform:
                type: string
                example: "linkedin"
              user_id:
                type: string
                example: "optional-user-id"
      id:
        type: integer
        example: 2
  
  ChatRequest:
    type: object
    required:
      - user_id
      - query
    properties:
      user_id:
        type: string
        description: User identifier
      query:
        type: string
        description: Topic for post generation
  
  GeneratePostResponse:
    type: object
    properties:
      post:
        type: string
      platform:
        type: string
      trace_id:
        type: string
  
  HealthResponse:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
      version:
        type: string
  
  MCPToolCallResponse:
    type: object
    properties:
      protocol:
        type: string
        default: mcp-streamable-1.0
      tool:
        type: string
      result:
        type: object
      user_id:
        type: string
      thread_id:
        type: string
      trace_id:
        type: string
      timestamp:
        type: string
  
  MCPToolsResponse:
    type: object
    properties:
      protocol:
        type: string
      tools:
        type: array
        items:
          type: object
      timestamp:
        type: string
  
  MCPInvokeRequest:
    type: object
    required:
      - tool
      - user_id
    properties:
      tool:
        type: string
        description: Tool name to invoke
      parameters:
        type: object
        description: Tool parameters
      user_id:
        type: string
        description: User identifier
      thread_id:
        type: string
        description: Thread ID
      stream:
        type: boolean
        description: Enable streaming
        default: false
      metadata:
        type: object
        description: Additional metadata
  
  MCPInvokeResponse:
    type: object
    properties:
      protocol:
        type: string
      tool:
        type: string
      result:
        type: object
      user_id:
        type: string
      trace_id:
        type: string
      timestamp:
        type: string
  
  JsonRpcRequest:
    type: object
    required:
      - jsonrpc
      - method
      - id
    properties:
      jsonrpc:
        type: string
        enum:
          - "2.0"
      id:
        type: string
      method:
        type: string
        enum:
          - initialize
          - tools/list
          - tools/call
      params:
        type: object
  
  JsonRpcResponse:
    type: object
    properties:
      jsonrpc:
        type: string
      id:
        type: string
      result:
        type: object
      error:
        type: object
  
  MCPHealthResponse:
    type: object
    properties:
      status:
        type: string
      protocol:
        type: string
      version:
        type: string
      server:
        type: string
      serverVersion:
        type: string

responses: {}
security: []
tags: []
securityDefinitions: {}
